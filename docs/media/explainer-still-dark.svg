        <path d="m1071 487 9 9 18-20" fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="key-tag"><g transform="translate(935 283)">
        <path d="M-68-23H50L68 0 50 23H-68Z" fill="var(--paper)" stroke="var(--gold)" stroke-width="2.5"/>
        <circle cx="52" cy="0" r="4" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="-49" y="8" class="mono gold" text-anchor="start">#key</text></g></g>
<text x="230" y="606" class="label" text-anchor="middle">Sender&#x27;s CLI</text>
<text x="640" y="606" class="label" text-anchor="middle">Drop server</text>
<text x="1050" y="606" class="label" text-anchor="middle">Recipient&#x27;s browser</text>
<text x="230" y="636" class="small" text-anchor="middle">Encrypts locally</text>
<text x="1050" y="636" class="small" text-anchor="middle">Decrypts locally</text>
<g class="await-status"><text x="640" y="636" class="small" text-anchor="middle">Ciphertext only</text></g>
<g class="deleted-status"><text x="640" y="636" class="small" text-anchor="middle">Ciphertext deleted</text></g>
<path d="M64 662H1216" class="fine"/>
<text x="64" y="696" class="small gold" text-anchor="start">The server never sees the key.</text>
<text x="1216" y="696" class="small" text-anchor="end">Default: 1 open / 24 hours</text>
</svg>