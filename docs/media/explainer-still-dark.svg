    <path d="m-57-32 57 38 57-38M-57 36l37-27m77 27L20 9" fill="none" stroke="#9fb7ff" stroke-width="2"/>
    <rect x="-17" y="-9" width="34" height="24" rx="2" fill="#edebe4"/>
    <path d="M-10-2h7m5 0h8M-10 4h4m4 0h12M-10 10h9m4 0h7" stroke="#13286e" stroke-width="3"/>
    </g></g>
<g class="reveal-button"><g class="press"><rect x="980" y="441" width="140" height="48" rx="6" fill="var(--lapis)"/><text x="1050" y="472" text-anchor="middle" style="fill:#08111f;font-weight:600">Reveal</text></g></g>
<g class="cursor"><path d="m1093 474 0 28 8-8 7 13 7-4-8-13 12-1Z" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/></g>
<g class="burn"><path d="M640 470C612 470 597 451 602 428 606 410 620 402 622 384 633 395 637 408 634 419 643 410 647 397 645 382 664 399 681 420 677 445 674 461 660 470 640 470Z" fill="var(--flame)"/>
        <path d="M640 466C627 466 619 456 622 444 625 434 633 429 634 418 645 428 653 440 651 452 649 461 646 466 640 466Z" fill="var(--core)"/>
        <path d="m589 415-7-12 10 3Zm92-16 4-12 7 9Zm-49-20-5-9 11 1Z" fill="var(--flame)" opacity=".7"/></g>
<g class="revealed"><path d="M991 424h101l18 18v70H991Z" fill="var(--bg)" stroke="var(--line)"/>
        <path d="M1092 424v18h18" class="fine"/>
